services:
  postgres:
    image: postgres:16-alpine
    container_name: open-trade-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_trade
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_trade"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: open-trade-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/open_trade?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      AMAP_API_KEY: your-amap-api-key
      ALIYUN_ACCESS_KEY_ID: ""
      ALIYUN_ACCESS_KEY_SECRET: ""
      ALIYUN_SMS_SIGN_NAME: ""
      ALIYUN_SMS_TEMPLATE_CODE: ""
      ALIYUN_OSS_REGION: ""
      ALIYUN_OSS_BUCKET: ""
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: open-trade-web
    depends_on:
      server:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"

  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    container_name: open-trade-admin
    depends_on:
      server:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5174:5174"

volumes:
  postgres_data:
